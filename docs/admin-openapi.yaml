openapi: 3.1.0
info:
  title: Gatekeeper Admin API
  version: "1"
  description: |
    Operator API for a running Gatekeeper gateway. It is served on its own
    listener (admin.listen, default 127.0.0.1:9090), never on the public
    proxy port, and is disabled unless admin.enabled is true.

    Every endpoint requires authentication: a bearer token (configured as
    its SHA-256 hash) or a verified client certificate when admin.mtls is
    enabled. Requests may additionally be restricted by admin.allowed_cidrs,
    and a source IP is locked out (429) after too many failed attempts.

    Endpoints marked `x-destructive: true` change what clients experience.
    Most actions accept `dry_run=true` to report what they would do
    without doing it.

    Every non-2xx response uses the Error schema.
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:9090
    description: Default admin listener (loopback only)
security:
  - bearerToken: []
  - clientCertificate: []

tags:
  - name: read
    description: Read-only views of the running gateway
  - name: actions
    description: Operations that change gateway state

paths:
  /admin/v1/status:
    get:
      tags: [read]
      summary: Version, uptime and config load time
      operationId: getStatus
      responses:
        "200":
          description: Gateway status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/config:
    get:
      tags: [read]
      summary: The running config, with every secret redacted
      description: |
        Same keys as the YAML config file. API keys (auth.api_keys, and
        rate_limit.clients keys under scope api_key) are replaced by their
        "key:<12 hex>" fingerprints; auth.jwt.secret, storage.redis.password
        and admin token hashes become "[REDACTED]"; credentials embedded in
        URLs are removed. File paths are shown, file contents never are.
      operationId: getConfig
      responses:
        "200":
          description: Redacted config
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/routes:
    get:
      tags: [read]
      summary: Configured routes and their backends
      operationId: listRoutes
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items: { $ref: "#/components/schemas/Route" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/backends:
    get:
      tags: [read]
      summary: Live state of every backend
      description: Includes backends a reload removed that are still draining.
      operationId: listBackends
      responses:
        "200":
          description: Backends
          content:
            application/json:
              schema:
                type: object
                properties:
                  backends:
                    type: array
                    items: { $ref: "#/components/schemas/Backend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/ratelimits/{client}:
    get:
      tags: [read]
      summary: A client's current quota, without consuming any
      operationId: getRateLimit
      parameters:
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Tier"
      responses:
        "200":
          description: Quota state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quota" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/cache/stats:
    get:
      tags: [read]
      summary: Response cache statistics
      description: Counts entries cached by this instance; hits, misses, writes and purges since startup.
      operationId: getCacheStats
      responses:
        "200":
          description: Cache statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/reload:
    post:
      tags: [actions]
      summary: Reload the config file (same as SIGHUP)
      description: |
        Re-reads and validates the config file and swaps it in atomically,
        along with the TLS certificates. If the new config is invalid the
        previous one stays active and 422 is returned with the validation
        error. With dry_run=true the file is only validated.
      operationId: reload
      parameters:
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Reloaded (or, with dry_run, valid)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReloadResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The new config is invalid; the previous config is still active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/cache/purge:
    post:
      tags: [actions]
      summary: Purge cached responses
      x-destructive: true
      description: |
        Removes cached responses by route, by request URL prefix, or all of
        them. Purging everything must be requested explicitly with
        {"all": true}; an empty body is rejected. Only entries cached by
        this instance are known; with a shared Redis store, purge each
        instance.
      operationId: purgeCache
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeRequest" }
            examples:
              route: { value: { route: "/api/users" } }
              prefix: { value: { url_prefix: "/api/users/42" } }
              all: { value: { all: true } }
      responses:
        "200":
          description: Purged (or, with dry_run, would purge) this many entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: Request body larger than admin.max_body_bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
        "502": { $ref: "#/components/responses/StoreError" }

  /admin/v1/ratelimits/{client}/reset:
    post:
      tags: [actions]
      summary: Give a client its full allowance back
      x-destructive: true
      operationId: resetRateLimit
      parameters:
        - $ref: "#/components/parameters/Client"
        - $ref: "#/components/parameters/Tier"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: The client's quota after the reset (or, with dry_run, unchanged)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Quota"
                  - $ref: "#/components/schemas/ActionResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
        "502": { $ref: "#/components/responses/StoreError" }

  /admin/v1/backends/{id}/drain:
    post:
      tags: [actions]
      summary: Take a backend out of rotation
      x-destructive: true
      description: |
        New requests stop going to the backend; requests already in flight
        finish normally. Health checks keep running. The backend stays out
        of rotation until enabled again or the process restarts, including
        across reloads that keep it. Draining a route's last backend in
        rotation is refused (409) unless force=true.
      operationId: drainBackend
      parameters:
        - $ref: "#/components/parameters/BackendID"
        - $ref: "#/components/parameters/DryRun"
        - name: force
          in: query
          description: Drain even the route's last backend in rotation.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Drained (or, with dry_run, would be)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/backends/{id}/enable:
    post:
      tags: [actions]
      summary: Put a drained backend back in rotation
      description: The backend receives traffic again once it is also healthy.
      operationId: enableBackend
      parameters:
        - $ref: "#/components/parameters/BackendID"
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendActionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/circuit-breakers/{id}/reset:
    post:
      tags: [actions]
      summary: Force a backend's circuit breaker closed
      description: Circuit breakers are per backend, so {id} is the backend ID.
      operationId: resetCircuitBreaker
      parameters:
        - $ref: "#/components/parameters/BackendID"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Reset (or, with dry_run, the current state)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreakerResetResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The backend's circuit breaker is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/access-control:
    get:
      tags: [read]
      summary: IP access control lists, trusted proxies, auto-ban settings, and active bans
      description: |
        The global policy and each route override as requests see them
        (route fields merged over the global ones), plus every active ban
        in the shared store — so with Redis, the bans of every instance.
        With no access control configured, only enabled false and an
        empty bans list are returned.
      operationId: getAccessControl
      responses:
        "200":
          description: Access control state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessControl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
        "502": { $ref: "#/components/responses/StoreError" }

  /admin/v1/bans:
    post:
      tags: [actions]
      summary: Ban a client address
      x-destructive: true
      description: |
        Rejects every request from the address on every instance sharing
        the store until the ban expires or is lifted, replacing any current
        ban of it. Addresses on access_control.auto_ban.never_ban and
        trusted proxies can't be banned (409). Needs access control to be
        configured (409 otherwise).
      operationId: createBan
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BanRequest" }
      responses:
        "201":
          description: Banned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BanResult" }
        "200":
          description: With dry_run, the ban that would be issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BanResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Access control isn't configured, or the address is protected from bans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
        "502": { $ref: "#/components/responses/StoreError" }

  /admin/v1/bans/{ip}:
    delete:
      tags: [actions]
      summary: Lift a ban
      description: Lifts the address's ban, automatic or manual, on every instance.
      operationId: deleteBan
      parameters:
        - name: ip
          in: path
          required: true
          description: A single IPv4 or IPv6 address.
          schema: { type: string }
          example: "203.0.113.7"
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Lifted (or, with dry_run, would be)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnbanResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Access control isn't configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
        "502": { $ref: "#/components/responses/StoreError" }

  /admin/v1/routes/{route}/split:
    get:
      tags: [read]
      summary: A route's traffic split
      description: |
        The current weight of every variant (with its configured weight
        and any post-rollback cooldown), the rollout's progress, whether an
        operator or a rollback is in control of the weights, and the last
        rollback.
      operationId: getSplit
      parameters:
        - $ref: "#/components/parameters/RouteID"
      responses:
        "200":
          description: The route's split
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Split" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The route has no traffic_split
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
    post:
      tags: [actions]
      summary: Change a route's traffic split
      x-destructive: true
      description: |
        - `set`: give every variant a new weight (adding up to 100). The
          rollout, if any, stops until `resume`.
        - `pause` / `resume`: freeze the rollout at its step, or carry on.
          After a `set`, `promote`, or rollback, `resume` returns to the
          configured behaviour: the rollout starts again from its first
          step, or the configured weights come back.
        - `promote`: send all traffic to one variant.
        - `rollback`: take all of one variant's traffic away and give it
          to the baseline.

        `promote` and `rollback` default to the rollout's variant, or with
        two variants to the one that isn't the baseline. Giving traffic to
        a variant cooling down after an automatic rollback answers 409
        unless `force` is set. Changes apply to this instance; the weights
        are kept across config reloads that leave the route's weights,
        rollout, and guardrails unchanged.
      operationId: changeSplit
      parameters:
        - $ref: "#/components/parameters/RouteID"
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplitRequest" }
      responses:
        "200":
          description: Applied (or, with dry_run, checked but not applied)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SplitResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            The route has no traffic_split, there's no rollout to pause or
            nothing to resume, the variant has no traffic to roll back (or
            is the baseline), or it's cooling down and force wasn't set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/faults:
    get:
      tags: [read]
      summary: Fault injection rules and their remaining time
      description: |
        The kill switch (fault_injection.global_enabled), the environment,
        and every fault rule held: config rules (from routes'
        fault_injection sections) and runtime rules (created here), in
        force or expired, with how long each has left. API keys a rule
        targets are shown as fingerprints.
      operationId: listFaults
      responses:
        "200":
          description: The fault rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }
    post:
      tags: [actions]
      summary: Create or replace a runtime fault rule
      x-destructive: true
      description: |
        Starts injecting delays, aborts, or connection resets into a share
        of a route's requests, for `ttl` (required, at most 24h). The rule
        has the same shape as a route's fault_injection section; a rule
        with the same `id` is replaced, and its TTL starts over. Runtime
        rules are tried before the route's config rule, newest first, and
        are kept across reloads (dropped only if their route is removed),
        but not across restarts. Nothing is injected while
        fault_injection.global_enabled is false: the rule is kept, and the
        response carries a warning. In a production-like environment a
        100% abort or connection reset needs `allow_full_abort: true`.
        Every creation is logged as a warning.
      operationId: createFault
      parameters:
        - $ref: "#/components/parameters/DryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaultRuleRequest" }
      responses:
        "200":
          description: Replaced an existing rule (or, with dry_run, checked but not applied)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultResult" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The id belongs to a config rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/faults/{id}:
    delete:
      tags: [actions]
      summary: Remove a fault rule
      description: |
        Takes the rule out of force at once. A config rule is only removed
        until the next reload or restart, which reads it from the config
        file again; the response notes this.
      operationId: deleteFault
      parameters:
        - name: id
          in: path
          required: true
          description: The rule's id, from GET /admin/v1/faults
          schema: { type: string }
          example: chaos-1
        - $ref: "#/components/parameters/DryRun"
      responses:
        "200":
          description: Removed (or, with dry_run, found but not removed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaultDeleteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

  /admin/v1/validation:
    get:
      tags: [read]
      summary: OpenAPI request validation specs and counts
      description: |
        Every route that validates requests against an OpenAPI spec: the
        spec as loaded at startup or by the last reload (file, title,
        version, SHA-256, when it was loaded), the route's validation
        settings, and its counts since the gateway started, which survive
        reloads. Routes without validation enabled aren't listed.
      operationId: listValidation
      responses:
        "200":
          description: The validated routes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyAuthFailures" }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: A token whose SHA-256 is listed in admin.tokens.
    clientCertificate:
      type: mutualTLS
      description: |
        A client certificate verified against admin.tls.client_ca_file,
        with a CN in admin.mtls.allowed_cns when that list is set.

  parameters:
    DryRun:
      name: dry_run
      in: query
      description: Report what would happen without changing anything.
      schema: { type: boolean, default: false }
    Client:
      name: client
      in: path
      required: true
      description: |
        The client as named in /metrics: an API key by its fingerprint
        "key:<12 hex>" (a raw key is rejected), "jwt:<id>", "mtls:<identity>",
        or the IP / header value for ip and header scopes.
      schema: { type: string }
      example: "key:9f8cfdb17116"
    Tier:
      name: tier
      in: query
      description: Rate limit tier to use, for clients whose tier comes from their credential.
      schema: { type: string }
    BackendID:
      name: id
      in: path
      required: true
      description: Backend ID from /admin/v1/backends or /admin/v1/routes.
      schema: { type: string, pattern: "^[0-9a-f]{12}$" }
    RouteID:
      name: route
      in: path
      required: true
      description: |
        The route's id from /admin/v1/routes, its label with slashes
        escaped (%2Fapi), or its path prefix without the leading slash
        (api).
      schema: { type: string }
      example: "%2Fapi"

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Source address not in admin.allowed_cidrs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAuthFailures:
      description: Too many failed authentication attempts from this address
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid parameters or request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such client, backend or endpoint
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The action would leave a route without backends; pass force=true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StoreError:
      description: The rate limit / cache store could not be reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, too_many_auth_failures, not_found, method_not_allowed,
                     bad_request, body_too_large, invalid_config, conflict, internal_error]
            message: { type: string }

    Status:
      type: object
      properties:
        version: { type: string, example: "2.6.0" }
        commit: { type: string }
        build_date: { type: string }
        go_version: { type: string }
        started_at: { type: string, format: date-time }
        uptime_seconds: { type: number }
        config_path: { type: string }
        config_loaded_at: { type: string, format: date-time }
        routes: { type: integer }
        storage_backend: { type: string, enum: [memory, redis] }
        rate_limit:
          type: object
          properties:
            algorithm: { type: string }
            scope: { type: string }
        tracing_enabled: { type: boolean }
        tls_enabled: { type: boolean }
        admin_tls_enabled: { type: boolean }
        backends_registered: { type: integer }

    Route:
      type: object
      properties:
        id: { type: string, description: "Identifies the route in admin paths", example: "8c8c7e3b2a1f" }
        label: { type: string }
        path_prefix: { type: string }
        host: { type: string }
        auth_mode: { type: string, enum: [api_key, jwt, mtls, either] }
        lb_strategy: { type: string }
        websocket: { type: boolean }
        backends:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              target: { type: string }
              weight: { type: integer }
              variant: { type: string, description: "On a split route, the variant the backend serves" }
        cache:
          type: object
          properties:
            enabled: { type: boolean }
            ttl: { type: string, example: "1m0s" }
        circuit_breaker:
          type: object
          properties:
            enabled: { type: boolean }
            failure_threshold: { type: integer }
            open_duration: { type: string }

    Backend:
      type: object
      properties:
        id: { type: string, example: "3fa2c1d4e5b6" }
        route: { type: string }
        target: { type: string }
        weight: { type: integer }
        healthy: { type: boolean, description: Passing health checks and not ejected }
        in_rotation: { type: boolean, description: Receiving new traffic }
        disabled: { type: boolean, description: Drained through the admin API }
        draining: { type: boolean, description: "Removed by a reload, finishing in-flight work" }
        in_flight: { type: integer }
        circuit_breaker: { type: string, enum: [closed, open, half_open, disabled] }

    Quota:
      type: object
      properties:
        client: { type: string }
        tier: { type: string }
        algorithm: { type: string }
        limit: { type: integer }
        remaining: { type: integer }
        allowed: { type: boolean, description: Whether the next request would be allowed }
        retry_after_seconds: { type: number }

    CacheStats:
      type: object
      properties:
        entries: { type: integer }
        entries_by_route:
          type: object
          additionalProperties: { type: integer }
        hits: { type: integer }
        misses: { type: integer }
        writes: { type: integer }
        purged: { type: integer }

    ActionResult:
      type: object
      properties:
        action: { type: string }
        dry_run: { type: boolean }

    ReloadResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            reloaded: { type: boolean }
            valid: { type: boolean, description: Set on dry runs }
            config_loaded_at: { type: string, format: date-time }
            routes: { type: integer }

    PurgeRequest:
      type: object
      additionalProperties: false
      properties:
        all: { type: boolean, description: Purge everything. Can't be combined with route or url_prefix. }
        route: { type: string, description: "Route label (its path prefix, or host)" }
        url_prefix: { type: string, description: Prefix of the cached request URI (path and query) }

    PurgeResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            purged: { type: integer }
            filter: { $ref: "#/components/schemas/PurgeRequest" }

    BackendActionResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            backend: { $ref: "#/components/schemas/Backend" }
            route_backends_in_rotation:
              type: integer
              description: Other backends of the route still in rotation (drain only)
            note: { type: string }

    BreakerResetResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            id: { type: string }
            route: { type: string }
            target: { type: string }
            previous_state: { type: string, enum: [closed, open, half_open] }
            state: { type: string, enum: [closed] }

    AccessPolicy:
      type: object
      properties:
        route: { type: string, description: Route label (route overrides only) }
        mode: { type: string, enum: [off, denylist, allowlist_only] }
        allow: { type: array, items: { type: string } }
        deny: { type: array, items: { type: string } }
        deny_status: { type: integer }

    Ban:
      type: object
      properties:
        ip: { type: string }
        source: { type: string, enum: [auto, manual] }
        reason: { type: string }
        level: { type: integer, description: "Which auto-ban of this address this is (escalation)" }
        banned_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    AccessControl:
      type: object
      properties:
        enabled: { type: boolean }
        global: { $ref: "#/components/schemas/AccessPolicy" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/AccessPolicy" }
        trusted_proxies: { type: array, items: { type: string } }
        auto_ban:
          type: object
          properties:
            enabled: { type: boolean }
            threshold: { type: integer }
            window: { type: string }
            ban_duration: { type: string }
            triggers:
              type: array
              items: { type: string, enum: [rate_limit, auth_failure, denied] }
            never_ban: { type: array, items: { type: string } }
            escalation:
              type: object
              properties:
                enabled: { type: boolean }
                multiplier: { type: number }
                max_duration: { type: string }
                reset_after: { type: string }
        bans:
          type: array
          items: { $ref: "#/components/schemas/Ban" }
        active_bans: { type: integer }

    BanRequest:
      type: object
      required: [ip]
      additionalProperties: false
      properties:
        ip: { type: string, description: A single IPv4 or IPv6 address }
        duration:
          type: string
          description: Go duration; defaults to access_control.auto_ban.ban_duration, or 1h
          example: "30m"
        reason: { type: string, maxLength: 200 }

    BanResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            ban: { $ref: "#/components/schemas/Ban" }

    UnbanResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            ip: { type: string }

    Split:
      type: object
      properties:
        route: { type: string }
        baseline: { type: string }
        variants:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              weight: { type: integer, minimum: 0, maximum: 100 }
              configured_weight: { type: integer }
              cooldown_until: { type: string, format: date-time }
        manual:
          type: boolean
          description: An operator or a rollback set the weights; resume undoes it
        rollout:
          type: object
          properties:
            variant: { type: string }
            steps: { type: array, items: { type: integer } }
            interval: { type: string, example: "10m0s" }
            step: { type: integer, description: Index into steps }
            weight: { type: integer }
            state: { type: string, enum: [running, paused, completed, stopped] }
            next_step_at: { type: string, format: date-time }
        last_rollback:
          type: object
          properties:
            variant: { type: string }
            trigger: { type: string, enum: [error_rate, latency, manual] }
            reason: { type: string }
            auto: { type: boolean }
            at: { type: string, format: date-time }

    SplitRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [set, pause, resume, promote, rollback] }
        weights:
          type: object
          additionalProperties: { type: integer, minimum: 0, maximum: 100 }
          description: For set, every variant's weight, adding up to 100
          example: { stable: 75, canary: 25 }
        variant: { type: string, description: For promote and rollback }
        reason: { type: string, maxLength: 200, description: Recorded with a rollback }
        force: { type: boolean, description: Give traffic to a variant that's cooling down }

    SplitResult:
      allOf:
        - $ref: "#/components/schemas/ActionResult"
        - type: object
          properties:
            split: { $ref: "#/components/schemas/Split" }

    FaultDelay:
      type: object
      required: [percentage]
      properties:
        percentage: { type: number, minimum: 0, maximum: 100 }
        fixed: { type: string, description: Go duration; set it or min and max, example: 500ms }
        min: { type: string, description: Go duration, example: 100ms }
        max: { type: string, description: Go duration, example: 2s }

    FaultAbort:
      type: object
      required: [percentage, status]
      properties:
        percentage: { type: number, minimum: 0, maximum: 100 }
        status: { type: integer, minimum: 400, maximum: 599, example: 503 }

    FaultReset:
      type: object
      required: [percentage]
      properties:
        percentage: { type: number, minimum: 0, maximum: 100 }

    FaultMatch:
      type: object
      description: Every condition set must hold for the rule to apply
      properties:
        header:
          type: object
          required: [name]
          properties:
            name: { type: string, example: X-Gatekeeper-Fault }
            value: { type: string, description: Any value when left out, example: "true" }
        path_prefixes: { type: array, items: { type: string } }
        methods: { type: array, items: { type: string } }
        variants: { type: array, items: { type: string }, description: Traffic split variants }
        backends: { type: array, items: { type: string }, description: Backend URLs }
        clients:
          type: object
          description: An allowlist; a client matching any entry matches
          properties:
            tiers: { type: array, items: { type: string } }
            api_keys: { type: array, items: { type: string }, description: Shown as fingerprints }
            cidrs: { type: array, items: { type: string } }

    FaultRuleRequest:
      type: object
      required: [route, ttl]
      additionalProperties: false
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$", description: "Generated when left out; may not start with config-" }
        route: { type: string, description: "The route's id, label, or path prefix without the leading slash" }
        ttl: { type: string, description: "Go duration, above 0 and at most 24h", example: 15m }
        delay: { $ref: "#/components/schemas/FaultDelay" }
        abort: { $ref: "#/components/schemas/FaultAbort" }
        connection_reset: { $ref: "#/components/schemas/FaultReset" }
        match: { $ref: "#/components/schemas/FaultMatch" }
        count_as_backend_failure: { type: boolean, default: true }
        allow_full_abort: { type: boolean, default: false }
      example:
        id: chaos-1
        route: api
        ttl: 15m
        delay: { percentage: 10, fixed: 500ms }
        abort: { percentage: 5, status: 503 }
        match: { header: { name: X-Gatekeeper-Fault, value: "true" } }

    FaultRule:
      type: object
      properties:
        id: { type: string }
        route: { type: string }
        route_id: { type: string }
        source: { type: string, enum: [config, runtime] }
        in_force: { type: boolean, description: "The kill switch is on and the rule hasn't expired" }
        expired: { type: boolean }
        started_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time, description: Null for a config rule without max_duration }
        remaining_seconds: { type: [number, "null"] }
        summary: { type: string, example: "delay 10% 500ms, abort 5% 503; header X-Gatekeeper-Fault=true" }
        delay: { $ref: "#/components/schemas/FaultDelay" }
        abort: { $ref: "#/components/schemas/FaultAbort" }
        connection_reset: { $ref: "#/components/schemas/FaultReset" }
        match: { $ref: "#/components/schemas/FaultMatch" }
        count_as_backend_failure: { type: boolean }
        allow_full_abort: { type: boolean }

    FaultList:
      type: object
      properties:
        global_enabled: { type: boolean }
        environment: { type: string, enum: [production, staging, development, test] }
        production_like: { type: boolean }
        active: { type: boolean, description: Any rule is in force }
        rules_in_force: { type: integer }
        rules: { type: array, items: { $ref: "#/components/schemas/FaultRule" } }

    FaultResult:
      type: object
      properties:
        dry_run: { type: boolean }
        replaced: { type: boolean }
        warning: { type: string, description: Set while the kill switch is off }
        rule: { $ref: "#/components/schemas/FaultRule" }

    FaultDeleteResult:
      type: object
      properties:
        dry_run: { type: boolean }
        note: { type: string, description: Set for a config rule }
        rule: { $ref: "#/components/schemas/FaultRule" }

    ValidationCounts:
      type: object
      properties:
        validated: { type: integer, description: Every request checked; the sum of the four below }
        passed: { type: integer }
        rejected: { type: integer, description: "Invalid, in enforce mode" }
        report_only: { type: integer, description: "Invalid, forwarded anyway in report_only mode" }
        unmatched: { type: integer, description: "No operation matched; forwarded unchecked" }
        rejected_by_reason:
          type: object
          additionalProperties: { type: integer }
          example: { body: 12, parameter: 3 }
        report_only_by_reason:
          type: object
          additionalProperties: { type: integer }

    ValidationRoute:
      type: object
      properties:
        route: { type: string, example: /api/orders }
        route_id: { type: string }
        mode: { type: string, enum: [enforce, report_only] }
        spec:
          type: object
          properties:
            file: { type: string, example: examples/openapi/orders.yaml }
            title: { type: string }
            version: { type: string }
            openapi: { type: string, example: 3.0.3 }
            operations: { type: integer }
            sha256: { type: string }
            loaded_at: { type: string, format: date-time }
            ignored_credential_parameters:
              type: integer
              description: Cookie and credential header parameters, which auth checks instead
        settings:
          type: object
          properties:
            reject_status: { type: integer, enum: [400, 422] }
            reject_unknown_operations: { type: boolean }
            validate_content_type: { type: boolean }
            validate_non_json_bodies: { type: boolean }
            max_body_bytes: { type: integer }
            max_json_depth: { type: integer }
            timeout: { type: string, example: 100ms }
        counters: { $ref: "#/components/schemas/ValidationCounts" }

    ValidationList:
      type: object
      properties:
        routes: { type: array, items: { $ref: "#/components/schemas/ValidationRoute" } }
        reasons:
          type: array
          description: Every reason a request can be invalid, in order of precedence
          items: { type: string }
          example: [unknown_operation, content_type, body_too_large, parameter, body, timeout, internal]
