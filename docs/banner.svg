<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d1a2b" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c0a14" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0c0a14" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0c0a14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0c0a14"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="980" cy="150" r="3" fill="#a78bfa"/>
  <circle cx="1040" cy="90" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="1100" cy="200" r="2.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="900" cy="60" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="1140" cy="120" r="2" fill="#a78bfa" opacity="0.7"/>
  <line x1="980" y1="150" x2="1040" y2="90" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
  <line x1="980" y1="150" x2="1100" y2="200" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
  <line x1="1040" y1="90" x2="1140" y2="120" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
  <line x1="900" y1="60" x2="980" y2="150" stroke="#a78bfa" stroke-width="0.8" opacity="0.2"/>

  <!-- gate mark: two posts + crossbar, replacing the shield icon -->
  <g transform="translate(100,150)">
    <rect x="-26" y="-40" width="10" height="80" rx="2" fill="#a78bfa"/>
    <rect x="16" y="-40" width="10" height="80" rx="2" fill="#a78bfa"/>
    <rect x="-26" y="-48" width="52" height="10" rx="2" fill="#a78bfa"/>
    <circle cx="0" cy="-4" r="5" fill="#2dd4bf"/>
    <circle cx="0" cy="16" r="5" fill="#2dd4bf" opacity="0.7"/>
  </g>

  <text x="175" y="140" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#f5f7f8">Gate<tspan fill="#a78bfa">keeper</tspan></text>
  <text x="177" y="175" font-family="Arial, sans-serif" font-size="17" fill="#9a92a8" letter-spacing="0.5">Rate limiter and API gateway, built with Go</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#5b566b">
    <rect x="177" y="200" width="120" height="26" rx="4" fill="none" stroke="#28223a" stroke-width="1"/>
    <text x="237" y="217" text-anchor="middle" fill="#9a92a8">Token bucket</text>

    <rect x="309" y="200" width="140" height="26" rx="4" fill="none" stroke="#28223a" stroke-width="1"/>
    <text x="379" y="217" text-anchor="middle" fill="#9a92a8">Sliding window</text>

    <rect x="461" y="200" width="90" height="26" rx="4" fill="none" stroke="#28223a" stroke-width="1"/>
    <text x="506" y="217" text-anchor="middle" fill="#9a92a8">Redis</text>

    <rect x="563" y="200" width="120" height="26" rx="4" fill="none" stroke="#28223a" stroke-width="1"/>
    <text x="623" y="217" text-anchor="middle" fill="#9a92a8">Prometheus</text>
  </g>

  <text x="177" y="258" font-family="Arial, sans-serif" font-size="13" fill="#403a4d">by Deipedra</text>
</svg>
