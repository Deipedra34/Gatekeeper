name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; each job asks only for what it writes.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/deipedra34/gatekeeper

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Same as ci.yml: runs the RedisStore integration test against the
      # service container above instead of skipping it.
      GATEKEEPER_TEST_REDIS_ADDR: localhost:6379

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          # Full history and tags, for the changelog since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      # The Go build cross-compiles natively; QEMU is only needed for the
      # final stage's `apk add` on arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v2.5.0 -> 2.5.0, plus `latest` unless it's a pre-release.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
