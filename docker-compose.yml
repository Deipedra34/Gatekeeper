# Runs the whole Gatekeeper stack for local end-to-end testing:
# gatekeeper itself, a Redis instance for shared rate-limit counters, and
# a minimal mock backend for gatekeeper to proxy requests to.
#
# Usage:
#   docker-compose up --build
#
# Then, from the host:
#   curl -i http://localhost:8080/api/ping -H "X-API-Key: demo-free-key"
#
# See README.md for more.

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-backend:
    build:
      context: ./mockbackend
    restart: unless-stopped
    expose:
      - "9000"

  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mock-backend:
        condition: service_started
    ports:
      # Gatekeeper is the only service reachable from the host.
      - "8080:8080"
    volumes:
      # Overrides the config baked into the image with the compose
      # variant, which points at "redis" and "mock-backend" by their
      # service name instead of localhost.
      - ./configs/config.docker.yaml:/app/configs/config.yaml:ro
