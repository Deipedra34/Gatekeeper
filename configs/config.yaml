# Gatekeeper configuration.
#
# This file is loaded once at startup (see -config flag on the
# gatekeeper binary). See README.md for a full field-by-field
# explanation and for the trade-offs between the three rate-limiting
# algorithms.

server:
  listen_addr: ":8080"
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

# storage.backend selects where rate-limit counters live:
#   memory - a mutex-protected map, local to this process. Simplest,
#            fastest, but each instance enforces its own independent
#            limit if you run more than one.
#   redis  - shared counters in Redis, so a fleet of gatekeeper
#            instances behind a load balancer enforce one combined
#            limit per client. If Redis becomes unreachable, gatekeeper
#            automatically falls back to in-memory limiting and logs a
#            warning rather than failing requests.
storage:
  backend: memory
  redis:
    addr: "localhost:6379"
    password: ""
    db: 0
    dial_timeout: 2s

rate_limit:
  # One of: token_bucket, sliding_window_log, fixed_window.
  algorithm: token_bucket

  # How a request is attributed to a client: api_key, ip, or header.
  scope: api_key

  # Only used when scope is "header".
  header_name: "X-Client-ID"

  # Per-tier allowance. requests_per_second is the sustained refill
  # rate used by token_bucket; burst is the bucket capacity for
  # token_bucket and the max requests per one-second window for
  # sliding_window_log / fixed_window. "default" applies to any client
  # not listed under `clients` below and must always be present.
  tiers:
    default:
      requests_per_second: 2
      burst: 5
    free:
      requests_per_second: 5
      burst: 10
    premium:
      requests_per_second: 50
      burst: 100

  # Maps a client identifier (matching the chosen `scope`) to a tier.
  clients:
    "demo-free-key": free
    "demo-premium-key": premium

# Authentication. `enabled` is the master switch: when false, every
# route is open regardless of its auth_mode (see `routes` below).
auth:
  enabled: true
  header: "X-API-Key"
  api_keys:
    - "demo-free-key"
    - "demo-premium-key"

  # JWT validation for routes with auth_mode "jwt" or "either". Only
  # needed if some route uses one of those modes. See README.md's "JWT
  # authentication" section.
  #
  # jwt:
  #   # HS256 (shared secret) or RS256 (RSA public key). Tokens signed
  #   # with any other algorithm, including "none", are rejected.
  #   algorithm: HS256
  #   # HS256: name of an env var holding the secret (>= 32 bytes), or
  #   # use `secret:` to put it inline. Set exactly one of the two.
  #   secret_env: GATEKEEPER_JWT_SECRET
  #   # RS256: PEM-encoded RSA public key (>= 2048 bits).
  #   # public_key_file: "keys/jwt-public.pem"
  #   # Optional: required iss / aud values. Unset = not checked.
  #   issuer: "https://auth.example.com"
  #   audience: "gatekeeper"
  #   # Clock skew allowed when checking exp / nbf (default: 0s).
  #   leeway: 30s
  #   # Claim identifying the client for rate limiting (default: sub).
  #   client_id_claim: sub
  #   # Optional claim naming the rate-limit tier (e.g. "premium").
  #   # Missing or unknown tier -> "default".
  #   tier_claim: tier

cors:
  enabled: true
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
  allow_credentials: false
  max_age: 300

# Backend services requests are proxied to. Matched by hostname first,
# then by longest matching path prefix.
#
# Each route also gets a GET response cache, stored in the same
# storage.backend configured above (memory or Redis):
#   cache.enabled - defaults to true; set to false to opt this route out
#                   of caching entirely.
#   cache.ttl     - how long a cached response stays valid (default: 60s).
# Only GET responses with status 200 and no "Cache-Control: no-store"
# are cached. Send "X-Bypass-Cache: 1" on a request to skip the cache
# entirely for debugging. See README.md's "Response caching" section.
#
# Each route also gets a circuit breaker wrapped around its backend
# calls (Closed -> Open -> Half-Open -> Closed/Open again):
#   circuit_breaker.enabled                      - defaults to true.
#   circuit_breaker.failure_threshold             - consecutive failed
#                                                    attempts (timeout,
#                                                    connection error, or
#                                                    5xx) that trip it to
#                                                    Open (default: 5).
#   circuit_breaker.open_duration                 - cooldown before a
#                                                    trial request is let
#                                                    through in Half-Open
#                                                    (default: 30s).
#   circuit_breaker.half_open_max_requests         - concurrent trial
#                                                    requests allowed in
#                                                    Half-Open (default: 1).
#   circuit_breaker.half_open_successes_to_close   - trial successes
#                                                    needed to close it
#                                                    again (default: 1).
#   circuit_breaker.half_open_failures_to_reopen   - trial failures that
#                                                    re-open it (default: 1).
# An Open circuit fails every request immediately with 503, without
# ever contacting the backend or consuming a retry attempt. See
# README.md's "Circuit breaker" section.
#
# Each route also picks which credential it requires (when auth is on):
#   auth_mode: api_key  - an API key in auth.header (the default).
#   auth_mode: jwt      - a JWT in "Authorization: Bearer <token>";
#                          requires the auth.jwt block above.
#   auth_mode: either   - a valid API key or a valid JWT.
routes:
  - path_prefix: "/api/users"
    target: "http://localhost:9001"
    cache:
      enabled: true
      ttl: 30s
    circuit_breaker:
      failure_threshold: 5
      open_duration: 30s
  - path_prefix: "/api/orders"
    target: "http://localhost:9002"
    cache:
      enabled: false
    circuit_breaker:
      enabled: false
  - path_prefix: "/"
    target: "http://localhost:9000"

metrics:
  enabled: true
  path: "/metrics"

# Controls how requests are forwarded to the backends above.
proxy:
  # Per-attempt timeout for a backend call (default: 5s if unset).
  timeout: 5s

  retry:
    # How many additional attempts after the first (default: 3).
    max_retries: 3
    # Delay before the first retry; doubles each attempt after that,
    # with jitter (default: 100ms).
    base_backoff: 100ms
    # Upper bound on the backoff delay, no matter how many retries have
    # happened (default: 2s).
    max_backoff: 2s
